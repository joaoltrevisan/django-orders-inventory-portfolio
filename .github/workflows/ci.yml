name: PostgreSQL verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PostgreSQL checks and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run isolated PostgreSQL verification
        run: python3 -m scripts.run_ci --output ci-results

      - name: Retry guarded cleanup
        if: always()
        run: python3 -m scripts.run_ci --cleanup ci-results/cleanup-state.json

      - name: Retain sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgresql-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            ci-results/summary.json
            ci-results/checks.json
            ci-results/roles.json
            ci-results/openapi.json
            ci-results/schema.json
            ci-results/runtime.json
